[workspace]
resolver = "2"
members = [
    "crates/friendly-compiler",
    "crates/casette-kernel",
    "crates/casette-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Casette Contributors"]

[workspace.dependencies]
friendly-compiler = { path = "crates/friendly-compiler" }
casette-kernel = { path = "crates/casette-kernel" }
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"
regex = "1.10"
